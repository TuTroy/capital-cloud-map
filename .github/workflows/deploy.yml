name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /home/ubuntu/capital-cloud-map

            # try direct git pull first, then fallback to ghproxy
            if ! git -c http.version=HTTP/1.1 pull 2>/dev/null; then
              echo "Direct git pull failed, trying mirror..."
              git -c http.version=HTTP/1.1 -c url."https://ghproxy.net/https://github.com/".insteadOf="https://github.com/" pull || {
                echo "GIT PULL FAILED - keeping current version"
                exit 1
              }
            fi

            source venv/bin/activate
            pip install -r requirements.txt -q
            kill $(lsof -ti:8080) 2>/dev/null || true
            sleep 1
            PRODUCTION=1 nohup venv/bin/python app.py > app.log 2>&1 &

            # wait up to 30s for app to start
            for i in $(seq 1 30); do
              sleep 1
              code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/ 2>/dev/null || echo "000")
              if [ "$code" = "200" ]; then
                echo "Deploy OK HTTP $code"
                exit 0
              fi
            done
            echo "Deploy FAILED - app did not start within 30s"
            tail -20 app.log
            exit 1
