name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /home/ubuntu/capital-cloud-map

            # Pull latest code (with HTTP/1.1 and ghproxy fallback for China servers)
            git config --local http.version HTTP/1.1
            if ! git pull 2>&1; then
              echo "Direct pull failed, trying ghproxy mirror..."
              git config --local url."https://ghproxy.net/https://github.com/".insteadOf "https://github.com/"
              git pull 2>&1 || {
                echo "GIT PULL FAILED — trying curl tarball fallback..."
                REPO="TuTroy/capital-cloud-map"
                BRANCH="main"
                curl -fsSL "https://ghproxy.net/https://github.com/$REPO/archive/refs/heads/$BRANCH.tar.gz" -o /tmp/repo.tar.gz || \
                  curl -fsSL "https://github.com/$REPO/archive/refs/heads/$BRANCH.tar.gz" -o /tmp/repo.tar.gz
                if [ -f /tmp/repo.tar.gz ]; then
                  tar xzf /tmp/repo.tar.gz --strip-components=1 -C .
                  rm /tmp/repo.tar.gz
                  echo "OK - tarball extracted"
                else
                  echo "ALL PULL METHODS FAILED"
                  exit 1
                fi
              }
              git config --local --unset url."https://ghproxy.net/https://github.com/".insteadOf 2>/dev/null || true
            fi

            source venv/bin/activate
            pip install -r requirements.txt -q
            kill $(lsof -ti:8080) 2>/dev/null || true
            sleep 1
            PRODUCTION=1 nohup venv/bin/python app.py > app.log 2>&1 &

            # wait up to 30s for app to start
            for i in $(seq 1 30); do
              sleep 1
              code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/ 2>/dev/null || echo "000")
              if [ "$code" = "200" ]; then
                echo "Deploy OK HTTP $code"
                exit 0
              fi
            done
            echo "Deploy FAILED - app did not start within 30s"
            tail -20 app.log
            exit 1
